name: SDK coverage

on:
  pull_request:
    paths:
      - requirements.txt
      - notebook.ipynb
      - scripts/check_sdk_coverage.py
      - .github/workflows/sdk-coverage.yml
  push:
    branches:
      - main
    paths:
      - requirements.txt
      - notebook.ipynb
      - scripts/check_sdk_coverage.py
      - .github/workflows/sdk-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python scripts/check_sdk_coverage.py
